<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">Exodis session in redis-cli</title>
  <desc id="desc">Two redis-cli panes connected to Exodis. The left pane sets a key with an expiry, shows that SET NX does not overwrite it, and reads it back. The right pane pushes three elements to a list, reads the range, and pops the first element with BLPOP.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }
    .bar   { font-size: 12px; fill: #8b949e; }
    .label { font-size: 10px; fill: #484f58; letter-spacing: 1.5px; }
    .sh    { fill: #7ee787; }
    .pr    { fill: #6e7681; }
    .cmd   { fill: #ff7b72; }
    .arg   { fill: #e6edf3; }
    .ok    { fill: #7ee787; }
    .nil   { fill: #8b949e; }
    .str   { fill: #a5d6ff; }
    .num   { fill: #d2a8ff; }
    .dim   { fill: #6e7681; }
  </style>

  <defs>
    <clipPath id="window">
      <rect width="880" height="290" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="880" height="290" fill="#0d1117"/>
    <rect width="880" height="38" fill="#161b22"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="289" rx="12" fill="none" stroke="#30363d"/>
  <line x1="0" y1="38.5" x2="880" y2="38.5" stroke="#30363d"/>
  <line x1="440.5" y1="39" x2="440.5" y2="289" stroke="#30363d"/>

  <circle cx="20" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="6" fill="#febc2e"/>
  <circle cx="60" cy="19" r="6" fill="#28c840"/>
  <text class="bar" x="440" y="23" text-anchor="middle">exodis · 127.0.0.1:6379</text>

  <text class="label" x="420" y="60" text-anchor="end">STRINGS</text>
  <text class="label" x="860" y="60" text-anchor="end">LISTS</text>

  <!-- Left pane: strings -->
  <text x="22" y="66"><tspan class="sh">$ </tspan><tspan class="arg">redis-cli</tspan></text>
  <text x="22" y="88"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">SET</tspan><tspan class="arg"> session:42 alice EX 60</tspan></text>
  <text x="22" y="110" class="ok">OK</text>
  <text x="22" y="132"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">SET</tspan><tspan class="arg"> session:42 bob NX</tspan></text>
  <text x="22" y="154" class="nil">(nil)</text>
  <text x="22" y="176"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">GET</tspan><tspan class="arg"> session:42</tspan></text>
  <text x="22" y="198" class="str">"alice"</text>
  <text x="22" y="220"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">TYPE</tspan><tspan class="arg"> session:42</tspan></text>
  <text x="22" y="242" class="ok">string</text>
  <text x="22" y="264"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="arg">█<animate attributeName="fill-opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- Right pane: lists -->
  <text x="462" y="66"><tspan class="sh">$ </tspan><tspan class="arg">redis-cli</tspan></text>
  <text x="462" y="88"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">RPUSH</tspan><tspan class="arg"> queue build test deploy</tspan></text>
  <text x="462" y="110"><tspan class="nil">(integer) </tspan><tspan class="num">3</tspan></text>
  <text x="462" y="132"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">LRANGE</tspan><tspan class="arg"> queue 0 -1</tspan></text>
  <text x="462" y="154"><tspan class="dim">1) </tspan><tspan class="str">"build"</tspan></text>
  <text x="462" y="176"><tspan class="dim">2) </tspan><tspan class="str">"test"</tspan></text>
  <text x="462" y="198"><tspan class="dim">3) </tspan><tspan class="str">"deploy"</tspan></text>
  <text x="462" y="220"><tspan class="pr">127.0.0.1:6379&gt; </tspan><tspan class="cmd">BLPOP</tspan><tspan class="arg"> queue 0</tspan></text>
  <text x="462" y="242"><tspan class="dim">1) </tspan><tspan class="str">"queue"</tspan></text>
  <text x="462" y="264"><tspan class="dim">2) </tspan><tspan class="str">"build"</tspan></text>
</svg>
